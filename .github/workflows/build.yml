name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "shellcheck"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "hadolint"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "compose"

  build:
    runs-on: ubuntu-latest
    needs: [hadolint, compose]
    strategy:
      matrix:
        service: [sender, receiver]
    steps:
      - uses: actions/checkout@v4
      - run: echo "build ${{ matrix.service }}"
