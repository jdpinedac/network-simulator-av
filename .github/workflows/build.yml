name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning ./*.sh sender/*.sh receiver/*.sh

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker pull hadolint/hadolint
          docker run --rm -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" -i hadolint/hadolint < sender/Dockerfile
          docker run --rm -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" -i hadolint/hadolint < receiver/Dockerfile

  compose-validate:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [hadolint, compose-validate]
    strategy:
      matrix:
        service: [sender, receiver]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker build ./${{ matrix.service }}
