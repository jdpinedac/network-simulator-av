name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Hadolint sender
        run: docker run --rm -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" -i hadolint/hadolint < sender/Dockerfile

      - name: Hadolint receiver
        run: docker run --rm -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" -i hadolint/hadolint < receiver/Dockerfile

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        service: [sender, receiver]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
